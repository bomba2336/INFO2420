<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>My Class Schedule</title>

<style type="text/css">

.center {
    text-align: center;
}

.schedule {
    margin: auto;
    width: 700px;
}

.caption {
    color: #003300;
    font-size: 22px;
    font-weight: bold;
}

.courses {
    background-color: #CCCCCC;
    width: 25%;
}

.days {
    width: 15%;
}

.dayheading {
    background-color: #99FF66;
}

th, td {
    border: 1px solid black;
    padding: 8px;
    text-align: center;
}

</style>
</head>

<body>

<div class="center">

<table class="schedule">

    <caption class="caption">My Class Schedule</caption>

    <colgroup class="courses"></colgroup>
    <colgroup class="days" span="5"></colgroup>

    <tr>
        <th>Courses</th>
        <th class="dayheading">Monday</th>
        <th class="dayheading">Tuesday</th>
        <th class="dayheading">Wednesday</th>
        <th class="dayheading">Thursday</th>
        <th class="dayheading">Friday</th>
    </tr>

    <tr>
        <th>IT 2530</th>
        <td colspan="5">Online</td>
    </tr>

    <tr>
        <th>INFO 3300</th>
        <td colspan="5">Online</td>
    </tr>

    <tr>
        <th>INFO 2420</th>
        <td colspan="5">Online</td>
    </tr>

    <tr>
        <th>MATH 1050</th>
        <td>9:00 - 9:50 AM</td>
        <td></td>
        <td>9:00 - 9:50 AM</td>
        <td></td>
        <td>9:00 - 9:50 AM</td>
    </tr>

</table>

</div>

</body>
</html>
